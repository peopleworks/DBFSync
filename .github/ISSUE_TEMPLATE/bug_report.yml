name: Bug report · Reportar un error
description: Something DBFSync did wrong · Algo que DBFSync hizo mal
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Answer in English or Spanish — whichever you are comfortable with.
        Responda en inglés o español, como prefiera.

        ⚠️ **Never paste a real DBF, a connection string, a password, or customer data.**
        Invent field and table names if the real ones are sensitive. For a security
        vulnerability, use the [security policy](https://github.com/peopleworks/DBFSync/security/policy)
        instead of a public issue.

        ⚠️ **Nunca pegue un DBF real, una cadena de conexión, una contraseña ni datos de
        clientes.** Invente los nombres si los reales son sensibles. Para una
        vulnerabilidad use la política de seguridad, no un issue público.

  - type: textarea
    id: what
    attributes:
      label: What happened · Qué pasó
      description: What you expected, and what you got instead.
      placeholder: |
        Expected: SALDO widened to numeric(14,2)
        Actual:   the table stopped with an incompatible-type error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: dbfsync --version
      placeholder: '1.0.0'
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Destination engine · Motor destino
      options:
        - PostgreSQL
        - SQL Server
        - SQLite
        - More than one · Más de uno
        - Not applicable · No aplica
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command · Comando
      description: The exact command, with any password redacted.
      render: powershell
      placeholder: dbfsync sync --profile erp-pg --source C:\ERP\Datos --tables clientes --sync-schema
    validations:
      required: true

  - type: textarea
    id: schema
    attributes:
      label: DBF field definitions · Definición de campos del DBF
      description: >
        The shape of the source table is what turns a report into a test. Invented
        names are fine — only the types and widths matter.
      render: text
      placeholder: |
        CLIENTES.DBF   CODIGO C(6), NOMBRE C(40), SALDO N(12,2), ALTA D

  - type: textarea
    id: log
    attributes:
      label: Log excerpt · Extracto del log
      description: >
        From %ProgramData%\PeopleWorks\DBFSync\logs\. Logs never contain passwords, but
        they can name your ERP tables and columns — redact what you need to.
      render: text

  - type: input
    id: environment
    attributes:
      label: Windows and engine version · Versión de Windows y del motor
      placeholder: 'Windows Server 2022 · PostgreSQL 16.2'

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting · Antes de enviar
      options:
        - label: This is not a security vulnerability · Esto no es una vulnerabilidad de seguridad
          required: true
        - label: No real credentials, customer data, or ERP files are included · No incluye credenciales, datos de clientes ni archivos reales del ERP
          required: true
